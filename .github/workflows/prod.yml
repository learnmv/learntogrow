name: Production CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_PREFIX: ghcr.io/learnmv/learntogrow

jobs:
  build-backend:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set variables
        id: vars
        run: |
          TIMESTAMP=$(date +%Y%m%d)
          SHORT_SHA=$(git rev-parse --short HEAD)
          IMAGE_TAG="prod-${TIMESTAMP}-${SHORT_SHA}"
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-backend:${{ steps.vars.outputs.image_tag }}
            ${{ env.IMAGE_PREFIX }}-backend:stable

  build-frontend:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set variables
        id: vars
        run: |
          TIMESTAMP=$(date +%Y%m%d)
          SHORT_SHA=$(git rev-parse --short HEAD)
          IMAGE_TAG="prod-${TIMESTAMP}-${SHORT_SHA}"
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:${{ steps.vars.outputs.image_tag }}
            ${{ env.IMAGE_PREFIX }}-frontend:stable

  deploy:
    needs: [build-backend, build-frontend]
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: Setup kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config

      - name: Deploy
        env:
          TAG: ${{ needs.build-backend.outputs.image_tag }}
        run: |
          kubectl set image deployment/backend backend=${{ env.IMAGE_PREFIX }}-backend:${{ env.TAG }} -n learntogrow-prod
          kubectl set image deployment/frontend frontend=${{ env.IMAGE_PREFIX }}-frontend:${{ env.TAG }} -n learntogrow-prod

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/backend -n learntogrow-prod --timeout=300s
          kubectl rollout status deployment/frontend -n learntogrow-prod --timeout=300s

      - name: Verify
        run: |
          echo "=== Production Deployment ==="
          kubectl get pods -n learntogrow-prod -o jsonpath='{range .items[*]}{.metadata.name}{": "}{.spec.containers[0].image}{"\n"}{end}'
          kubectl get pods -n learntogrow-prod

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ needs.build-backend.outputs.image_tag }}
          release_name: Release v${{ needs.build-backend.outputs.image_tag }}
          body: |
            Production deployment completed successfully.

            **Images:**
            - Backend: `${{ env.IMAGE_PREFIX }}-backend:${{ needs.build-backend.outputs.image_tag }}`
            - Frontend: `${{ env.IMAGE_PREFIX }}-frontend:${{ needs.build-backend.outputs.image_tag }}`
          draft: false
          prerelease: false
