name: Production CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_PREFIX: ghcr.io/learnmv/learntogrow

jobs:
  build-backend:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set variables
        id: vars
        run: |
          TIMESTAMP=$(date +%Y%m%d)
          SHORT_SHA=$(git rev-parse --short HEAD)
          IMAGE_TAG="prod-${TIMESTAMP}-${SHORT_SHA}"
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        run: |
          docker build --compress -t ${{ steps.vars.outputs.backend_image }} ./backend
          docker tag ${{ steps.vars.outputs.backend_image }} ${{ steps.vars.outputs.backend_stable }}

      - name: Push backend image with retry
        run: |
          for i in 1 2 3; do
            echo "Attempt $i..."
            docker push ${{ steps.vars.outputs.backend_image }} && docker push ${{ steps.vars.outputs.backend_stable }} && break
            echo "Push failed, waiting 10s before retry..."
            sleep 10
          done
          # If we exhausted all retries, the for loop exits normally.
          # We must fail the step so the deploy job doesn't run with a missing image.
          docker image inspect ${{ steps.vars.outputs.backend_image }} >/dev/null 2>>&1 || {
            echo "ERROR: Backend image was not pushed after 3 attempts"
            exit 1
          }

  build-frontend:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set variables
        id: vars
        run: |
          TIMESTAMP=$(date +%Y%m%d)
          SHORT_SHA=$(git rev-parse --short HEAD)
          IMAGE_TAG="prod-${TIMESTAMP}-${SHORT_SHA}"
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build frontend image
        run: |
          docker build --compress -t ${{ steps.vars.outputs.frontend_image }} ./frontend
          docker tag ${{ steps.vars.outputs.frontend_image }} ${{ steps.vars.outputs.frontend_stable }}

      - name: Push frontend image with retry
        run: |
          for i in 1 2 3; do
            echo "Attempt $i..."
            docker push ${{ steps.vars.outputs.frontend_image }} && docker push ${{ steps.vars.outputs.frontend_stable }} && break
            echo "Push failed, waiting 10s before retry..."
            sleep 10
          done
          # If we exhausted all retries, the for loop exits normally.
          # We must fail the step so the deploy job doesn't run with a missing image.
          docker image inspect ${{ steps.vars.outputs.frontend_image }} >/dev/null 2>>&1 || {
            echo "ERROR: Frontend image was not pushed after 3 attempts"
            exit 1
          }

  deploy:
    needs: [build-backend, build-frontend]
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: Setup kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config

      - name: Deploy
        env:
          TAG: ${{ needs.build-backend.outputs.image_tag }}
        run: |
          kubectl set image deployment/backend backend=${{ env.IMAGE_PREFIX }}-backend:${{ env.TAG }} -n learntogrow-prod
          kubectl set image deployment/frontend frontend=${{ env.IMAGE_PREFIX }}-frontend:${{ env.TAG }} -n learntogrow-prod

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/backend -n learntogrow-prod --timeout=300s
          kubectl rollout status deployment/frontend -n learntogrow-prod --timeout=300s

      - name: Verify
        run: |
          echo "=== Production Deployment ==="
          kubectl get pods -n learntogrow-prod -o jsonpath='{range .items[*]}{.metadata.name}{": "}{.spec.containers[0].image}{"\n"}{end}'
          kubectl get pods -n learntogrow-prod

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ needs.build-backend.outputs.image_tag }}
          release_name: Release v${{ needs.build-backend.outputs.image_tag }}
          body: |
            Production deployment completed successfully.

            **Images:**
            - Backend: `${{ env.IMAGE_PREFIX }}-backend:${{ needs.build-backend.outputs.image_tag }}`
            - Frontend: `${{ env.IMAGE_PREFIX }}-frontend:${{ needs.build-backend.outputs.image_tag }}`
          draft: false
          prerelease: false
