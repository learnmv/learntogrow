name: Production CI/CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  BUILD_DIR: /home/sysadmin/prod-builds
  BACKEND_IMAGE: learntogrow-backend:stable
  FRONTEND_IMAGE: learntogrow-frontend:stable

jobs:
  version:
    runs-on: self-hosted
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: get_version
        run: |
          VERSION=$(date +'%Y.%m.%d')-${GITHUB_SHA::7}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

  build-backend:
    needs: version
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create build directory
        run: mkdir -p ${{ env.BUILD_DIR }}

      - name: Build backend image
        run: |
          docker build -t ${{ env.BACKEND_IMAGE }} ./backend
          docker tag ${{ env.BACKEND_IMAGE }} learntogrow-backend:v${{ needs.version.outputs.version }}

      - name: Save backend images
        run: |
          docker save ${{ env.BACKEND_IMAGE }} > ${{ env.BUILD_DIR }}/learntogrow-backend-stable.tar
          docker save learntogrow-backend:v${{ needs.version.outputs.version }} > ${{ env.BUILD_DIR }}/learntogrow-backend-v${{ needs.version.outputs.version }}.tar
          echo "Backend images saved:"
          ls -lh ${{ env.BUILD_DIR }}/learntogrow-backend*

  build-frontend:
    needs: version
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create build directory
        run: mkdir -p ${{ env.BUILD_DIR }}

      - name: Build frontend image
        run: |
          docker build -t ${{ env.FRONTEND_IMAGE }} ./frontend
          docker tag ${{ env.FRONTEND_IMAGE }} learntogrow-frontend:v${{ needs.version.outputs.version }}

      - name: Save frontend images
        run: |
          docker save ${{ env.FRONTEND_IMAGE }} > ${{ env.BUILD_DIR }}/learntogrow-frontend-stable.tar
          docker save learntogrow-frontend:v${{ needs.version.outputs.version }} > ${{ env.BUILD_DIR }}/learntogrow-frontend-v${{ needs.version.outputs.version }}.tar
          echo "Frontend images saved:"
          ls -lh ${{ env.BUILD_DIR }}/learntogrow-frontend*

  deploy:
    needs: [version, build-backend, build-frontend]
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load images from build directory
        run: |
          echo "Loading backend image..."
          docker load < ${{ env.BUILD_DIR }}/learntogrow-backend-stable.tar
          echo "Loading frontend image..."
          docker load < ${{ env.BUILD_DIR }}/learntogrow-frontend-stable.tar
          echo "Images loaded:"
          docker images | grep learntogrow

      - name: Setup kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config

      - name: Deploy to Kubernetes (Production)
        run: |
          cd k8s
          # Update kustomization to use local images
          cat > kustomization.yaml << EOF
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          namespace: default
          resources:
            - secrets.yaml
            - backend-deployment.yaml
            - backend-service.yaml
            - frontend-deployment.yaml
            - frontend-service.yaml
            - ingress.yaml
          images:
            - name: ghcr.io/learnmv/learntogrow-backend
              newName: learntogrow-backend
              newTag: stable
            - name: ghcr.io/learnmv/learntogrow-frontend
              newName: learntogrow-frontend
              newTag: stable
          commonLabels:
            app.kubernetes.io/name: learntogrow
            app.kubernetes.io/part-of: learntogrow-platform
          EOF
          kubectl apply -k .

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/learntogrow-backend -n default --timeout=300s
          kubectl rollout status deployment/learntogrow-frontend -n default --timeout=300s

      - name: Verify deployment
        run: |
          echo "=== Production Deployment ==="
          kubectl get pods -n default
          kubectl get svc -n default
          kubectl get ingress -n default

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ needs.version.outputs.version }}
          release_name: Release v${{ needs.version.outputs.version }}
          body: |
            Production deployment completed successfully.

            **Images stored locally:**
            - Backend: `${{ env.BUILD_DIR }}/learntogrow-backend-stable.tar`
            - Frontend: `${{ env.BUILD_DIR }}/learntogrow-frontend-stable.tar`
            - Versioned backups also saved
          draft: false
          prerelease: false
