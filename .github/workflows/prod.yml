name: Production CI/CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/learntogrow-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/learntogrow-frontend

jobs:
  version:
    runs-on: self-hosted
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: get_version
        run: |
          # Generate version from date and short SHA
          VERSION=$(date +'%Y.%m.%d')-${GITHUB_SHA::7}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

  build-backend:
    needs: version
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:stable
            ${{ env.BACKEND_IMAGE }}:v${{ needs.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    needs: version
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:stable
            ${{ env.FRONTEND_IMAGE }}:v${{ needs.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [version, build-backend, build-frontend]
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config

      - name: Deploy to Kubernetes (Production)
        run: |
          cd k8s
          # Update image tags to stable
          kustomize edit set image \
            ${{ env.BACKEND_IMAGE }}=${{ env.BACKEND_IMAGE }}:stable \
            ${{ env.FRONTEND_IMAGE }}=${{ env.FRONTEND_IMAGE }}:stable
          # Apply manifests
          kubectl apply -k .

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/learntogrow-backend -n default --timeout=300s
          kubectl rollout status deployment/learntogrow-frontend -n default --timeout=300s

      - name: Verify deployment
        run: |
          echo "=== Production Deployment ==="
          kubectl get pods -n default
          kubectl get svc -n default
          kubectl get ingress -n default

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ needs.version.outputs.version }}
          release_name: Release v${{ needs.version.outputs.version }}
          body: |
            Production deployment completed successfully.

            **Images:**
            - Backend: `${{ env.BACKEND_IMAGE }}:v${{ needs.version.outputs.version }}`
            - Frontend: `${{ env.FRONTEND_IMAGE }}:v${{ needs.version.outputs.version }}`
          draft: false
          prerelease: false
