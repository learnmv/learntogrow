name: Production CI/CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/learnmv/learntogrow-backend:stable
  FRONTEND_IMAGE: ghcr.io/learnmv/learntogrow-frontend:stable

jobs:
  version:
    runs-on: self-hosted
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: get_version
        run: |
          VERSION=$(date +'%Y.%m.%d')-${GITHUB_SHA::7}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

  build-backend:
    needs: version
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend images
        run: |
          docker build -t ${{ env.BACKEND_IMAGE }} ./backend
          docker tag ${{ env.BACKEND_IMAGE }} ghcr.io/learnmv/learntogrow-backend:v${{ needs.version.outputs.version }}
          docker push ${{ env.BACKEND_IMAGE }}
          docker push ghcr.io/learnmv/learntogrow-backend:v${{ needs.version.outputs.version }}

  build-frontend:
    needs: version
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend images
        run: |
          docker build -t ${{ env.FRONTEND_IMAGE }} ./frontend
          docker tag ${{ env.FRONTEND_IMAGE }} ghcr.io/learnmv/learntogrow-frontend:v${{ needs.version.outputs.version }}
          docker push ${{ env.FRONTEND_IMAGE }}
          docker push ghcr.io/learnmv/learntogrow-frontend:v${{ needs.version.outputs.version }}

  deploy:
    needs: [version, build-backend, build-frontend]
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config

      - name: Deploy to Kubernetes (Production)
        run: |
          cd k8s
          kubectl apply -k . --validate=false

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/learntogrow-backend -n default --timeout=300s
          kubectl rollout status deployment/learntogrow-frontend -n default --timeout=300s

      - name: Verify deployment
        run: |
          echo "=== Production Deployment ==="
          kubectl get pods -n default
          kubectl get svc -n default

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ needs.version.outputs.version }}
          release_name: Release v${{ needs.version.outputs.version }}
          body: |
            Production deployment completed successfully.

            **Images pushed to GHCR:**
            - Backend: `${{ env.BACKEND_IMAGE }}`
            - Frontend: `${{ env.FRONTEND_IMAGE }}`
            - Versioned images also tagged with `v${{ needs.version.outputs.version }}`
          draft: false
          prerelease: false
