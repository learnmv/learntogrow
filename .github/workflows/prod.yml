name: Production CI/CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/learnmv/learntogrow

jobs:
  build-backend:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set variables
        id: vars
        run: |
          TIMESTAMP=$(date +%Y%m%d)
          SHORT_SHA=$(git rev-parse --short HEAD)
          IMAGE_TAG="prod-${TIMESTAMP}-${SHORT_SHA}"
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "backend_image=${{ env.IMAGE_PREFIX }}-backend:${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "backend_stable=${{ env.IMAGE_PREFIX }}-backend:stable" >> $GITHUB_OUTPUT
          echo "Building with tag: ${IMAGE_TAG}"

      - name: Configure Docker daemon
        run: |
          sudo mkdir -p /etc/docker
          echo '{"max-concurrent-uploads": 2, "max-concurrent-downloads": 3}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker || true

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        run: |
          docker build --compress -t ${{ steps.vars.outputs.backend_image }} ./backend
          docker tag ${{ steps.vars.outputs.backend_image }} ${{ steps.vars.outputs.backend_stable }}

      - name: Push backend image with retry
        run: |
          for i in 1 2 3; do
            echo "Attempt $i..."
            docker push ${{ steps.vars.outputs.backend_image }} && docker push ${{ steps.vars.outputs.backend_stable }} && break
            echo "Push failed, waiting 10s before retry..."
            sleep 10
          done

  build-frontend:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set variables
        id: vars
        run: |
          TIMESTAMP=$(date +%Y%m%d)
          SHORT_SHA=$(git rev-parse --short HEAD)
          IMAGE_TAG="prod-${TIMESTAMP}-${SHORT_SHA}"
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "frontend_image=${{ env.IMAGE_PREFIX }}-frontend:${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "frontend_stable=${{ env.IMAGE_PREFIX }}-frontend:stable" >> $GITHUB_OUTPUT
          echo "Building with tag: ${IMAGE_TAG}"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build frontend image
        run: |
          docker build --compress -t ${{ steps.vars.outputs.frontend_image }} ./frontend
          docker tag ${{ steps.vars.outputs.frontend_image }} ${{ steps.vars.outputs.frontend_stable }}

      - name: Push frontend image with retry
        run: |
          for i in 1 2 3; do
            echo "Attempt $i..."
            docker push ${{ steps.vars.outputs.frontend_image }} && docker push ${{ steps.vars.outputs.frontend_stable }} && break
            echo "Push failed, waiting 10s before retry..."
            sleep 10
          done

  deploy:
    needs: [build-backend, build-frontend]
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set variables
        id: vars
        run: |
          TIMESTAMP=$(date +%Y%m%d)
          SHORT_SHA=$(git rev-parse --short HEAD)
          IMAGE_TAG="prod-${TIMESTAMP}-${SHORT_SHA}"
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT

      - name: Setup kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config

      - name: Update image tags and deploy
        run: |
          cd k8s/overlays/prod
          # Update image tags in kustomization (using sed since kustomize CLI not installed)
          sed -i "s/newTag: stable/newTag: ${{ steps.vars.outputs.image_tag }}/g" kustomization.yaml
          cat kustomization.yaml
          # Deploy
          kubectl apply -k .

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/backend -n learntogrow-prod --timeout=300s
          kubectl rollout status deployment/frontend -n learntogrow-prod --timeout=300s

      - name: Verify deployment
        run: |
          echo "=== Production Deployment ==="
          kubectl get pods -n learntogrow-prod -o jsonpath='{range .items[*]}{.metadata.name}{": "}{.spec.containers[0].image}{"\n"}{end}'
          kubectl get pods -n learntogrow-prod
          kubectl get svc -n learntogrow-prod

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.vars.outputs.image_tag }}
          release_name: Release v${{ steps.vars.outputs.image_tag }}
          body: |
            Production deployment completed successfully.

            **Images pushed to GHCR:**
            - Backend: `${{ env.IMAGE_PREFIX }}-backend:${{ steps.vars.outputs.image_tag }}`
            - Frontend: `${{ env.IMAGE_PREFIX }}-frontend:${{ steps.vars.outputs.image_tag }}`
          draft: false
          prerelease: false

  cleanup:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Cleanup old backend images
        uses: actions/delete-package-versions@v5
        with:
          package-name: learntogrow-backend
          package-type: container
          min-versions-to-keep: 3
          delete-only-untagged-versions: true

      - name: Cleanup old frontend images
        uses: actions/delete-package-versions@v5
        with:
          package-name: learntogrow-frontend
          package-type: container
          min-versions-to-keep: 3
          delete-only-untagged-versions: true
