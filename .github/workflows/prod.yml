name: Production CI/CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/learnmv/learntogrow-backend:stable
  FRONTEND_IMAGE: ghcr.io/learnmv/learntogrow-frontend:stable

jobs:
  version:
    runs-on: self-hosted
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: get_version
        run: |
          VERSION=$(date +'%Y.%m.%d')-${GITHUB_SHA::7}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

  build-backend:
    needs: version
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Docker daemon
        run: |
          sudo mkdir -p /etc/docker
          echo '{"max-concurrent-uploads": 2, "max-concurrent-downloads": 3}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker || true

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend images
        run: |
          docker build --compress -t ${{ env.BACKEND_IMAGE }} ./backend
          docker tag ${{ env.BACKEND_IMAGE }} ghcr.io/learnmv/learntogrow-backend:v${{ needs.version.outputs.version }}

      - name: Push backend images with retry
        run: |
          for image in "${{ env.BACKEND_IMAGE }}" "ghcr.io/learnmv/learntogrow-backend:v${{ needs.version.outputs.version }}"; do
            for i in 1 2 3; do
              echo "Pushing $image (attempt $i)..."
              docker push "$image" && break
              echo "Push failed, waiting 10s before retry..."
              sleep 10
            done
          done

  build-frontend:
    needs: version
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build frontend images
        run: |
          docker build --compress -t ${{ env.FRONTEND_IMAGE }} ./frontend
          docker tag ${{ env.FRONTEND_IMAGE }} ghcr.io/learnmv/learntogrow-frontend:v${{ needs.version.outputs.version }}

      - name: Push frontend images with retry
        run: |
          for image in "${{ env.FRONTEND_IMAGE }}" "ghcr.io/learnmv/learntogrow-frontend:v${{ needs.version.outputs.version }}"; do
            for i in 1 2 3; do
              echo "Pushing $image (attempt $i)..."
              docker push "$image" && break
              echo "Push failed, waiting 10s before retry..."
              sleep 10
            done
          done

  deploy:
    needs: [version, build-backend, build-frontend]
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config

      - name: Deploy to Kubernetes (Production)
        run: |
          kubectl apply -k k8s/overlays/prod/ --validate=false

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/learntogrow-backend -n default --timeout=300s
          kubectl rollout status deployment/learntogrow-frontend -n default --timeout=300s

      - name: Verify deployment
        run: |
          echo "=== Production Deployment ==="
          kubectl get pods -n default
          kubectl get svc -n default

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ needs.version.outputs.version }}
          release_name: Release v${{ needs.version.outputs.version }}
          body: |
            Production deployment completed successfully.

            **Images pushed to GHCR:**
            - Backend: `${{ env.BACKEND_IMAGE }}`
            - Frontend: `${{ env.FRONTEND_IMAGE }}`
            - Versioned images also tagged with `v${{ needs.version.outputs.version }}`
          draft: false
          prerelease: false
