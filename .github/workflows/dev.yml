name: Dev CI/CD

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/learnmv/learntogrow-backend:dev
  FRONTEND_IMAGE: ghcr.io/learnmv/learntogrow-frontend:dev

jobs:
  build-backend:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Docker daemon
        run: |
          sudo mkdir -p /etc/docker
          echo '{"max-concurrent-uploads": 2, "max-concurrent-downloads": 3}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker || true

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        run: |
          docker build --compress -t ${{ env.BACKEND_IMAGE }} ./backend

      - name: Push backend image with retry
        run: |
          for i in 1 2 3; do
            echo "Attempt $i..."
            docker push ${{ env.BACKEND_IMAGE }} && break
            echo "Push failed, waiting 10s before retry..."
            sleep 10
          done

  build-frontend:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build frontend image
        run: |
          docker build --compress -t ${{ env.FRONTEND_IMAGE }} ./frontend

      - name: Push frontend image with retry
        run: |
          for i in 1 2 3; do
            echo "Attempt $i..."
            docker push ${{ env.FRONTEND_IMAGE }} && break
            echo "Push failed, waiting 10s before retry..."
            sleep 10
          done

  deploy:
    needs: [build-backend, build-frontend]
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config

      - name: Deploy to Kubernetes
        run: |
          cd k8s
          kubectl apply -k . --validate=false

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/learntogrow-backend -n default --timeout=300s
          kubectl rollout status deployment/learntogrow-frontend -n default --timeout=300s

      - name: Verify deployment
        run: |
          kubectl get pods -n default
          kubectl get svc -n default
