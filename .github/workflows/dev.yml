name: Dev CI/CD

on:
  push:
    branches: [dev]
  workflow_dispatch:

env:
  IMAGE_PREFIX: ghcr.io/learnmv/learntogrow

jobs:
  build-backend:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set variables
        id: vars
        run: |
          TIMESTAMP=$(date +%Y%m%d)
          SHORT_SHA=$(git rev-parse --short HEAD)
          IMAGE_TAG="dev-${TIMESTAMP}-${SHORT_SHA}"
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-backend:${{ steps.vars.outputs.image_tag }}
            ${{ env.IMAGE_PREFIX }}-backend:dev

  build-frontend:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set variables
        id: vars
        run: |
          TIMESTAMP=$(date +%Y%m%d)
          SHORT_SHA=$(git rev-parse --short HEAD)
          IMAGE_TAG="dev-${TIMESTAMP}-${SHORT_SHA}"
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:${{ steps.vars.outputs.image_tag }}
            ${{ env.IMAGE_PREFIX }}-frontend:dev

  deploy:
    needs: [build-backend, build-frontend]
    runs-on: self-hosted
    steps:
      - name: Setup kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config

      - name: Deploy
        env:
          TAG: ${{ needs.build-backend.outputs.image_tag }}
        run: |
          kubectl set image deployment/backend backend=${{ env.IMAGE_PREFIX }}-backend:${{ env.TAG }} -n learntogrow-dev
          kubectl set image deployment/frontend frontend=${{ env.IMAGE_PREFIX }}-frontend:${{ env.TAG }} -n learntogrow-dev

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/backend -n learntogrow-dev --timeout=300s
          kubectl rollout status deployment/frontend -n learntogrow-dev --timeout=300s

      - name: Verify
        run: |
          echo "Deployed images:"
          kubectl get pods -n learntogrow-dev -o jsonpath='{range .items[*]}{.metadata.name}{": "}{.spec.containers[0].image}{"\n"}{end}'
          kubectl get pods -n learntogrow-dev
