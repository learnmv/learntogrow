name: Dev CI/CD

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

env:
  BUILD_DIR: /home/sysadmin/dev-builds
  BACKEND_IMAGE: learntogrow-backend:dev
  FRONTEND_IMAGE: learntogrow-frontend:dev

jobs:
  build-backend:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create build directory
        run: mkdir -p ${{ env.BUILD_DIR }}

      - name: Build backend image
        run: |
          docker build -t ${{ env.BACKEND_IMAGE }} ./backend

      - name: Save backend image
        run: |
          docker save ${{ env.BACKEND_IMAGE }} > ${{ env.BUILD_DIR }}/learntogrow-backend-dev.tar
          echo "Backend image saved to ${{ env.BUILD_DIR }}/learntogrow-backend-dev.tar"
          ls -lh ${{ env.BUILD_DIR }}/

  build-frontend:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create build directory
        run: mkdir -p ${{ env.BUILD_DIR }}

      - name: Build frontend image
        run: |
          docker build -t ${{ env.FRONTEND_IMAGE }} ./frontend

      - name: Save frontend image
        run: |
          docker save ${{ env.FRONTEND_IMAGE }} > ${{ env.BUILD_DIR }}/learntogrow-frontend-dev.tar
          echo "Frontend image saved to ${{ env.BUILD_DIR }}/learntogrow-frontend-dev.tar"
          ls -lh ${{ env.BUILD_DIR }}/

  deploy:
    needs: [build-backend, build-frontend]
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load images from build directory
        run: |
          echo "Loading backend image..."
          docker load < ${{ env.BUILD_DIR }}/learntogrow-backend-dev.tar
          echo "Loading frontend image..."
          docker load < ${{ env.BUILD_DIR }}/learntogrow-frontend-dev.tar
          echo "Images loaded:"
          docker images | grep learntogrow

      - name: Setup kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config

      - name: Deploy to Kubernetes
        run: |
          cd k8s
          # Update kustomization to use local images
          cat > kustomization.yaml << EOF
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          namespace: default
          resources:
            - secrets.yaml
            - backend-deployment.yaml
            - backend-service.yaml
            - frontend-deployment.yaml
            - frontend-service.yaml
            - ingress.yaml
          images:
            - name: ghcr.io/learnmv/learntogrow-backend
              newName: learntogrow-backend
              newTag: dev
            - name: ghcr.io/learnmv/learntogrow-frontend
              newName: learntogrow-frontend
              newTag: dev
          commonLabels:
            app.kubernetes.io/name: learntogrow
            app.kubernetes.io/part-of: learntogrow-platform
          EOF
          kubectl apply -k . --validate=false

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/learntogrow-backend -n default --timeout=300s
          kubectl rollout status deployment/learntogrow-frontend -n default --timeout=300s

      - name: Verify deployment
        run: |
          kubectl get pods -n default
          kubectl get svc -n default
