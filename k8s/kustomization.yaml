apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: default

resources:
  - secrets.yaml
  - backend-deployment.yaml
  - backend-service.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml

images:
  - name: ghcr.io/learnmv/learntogrow-backend
    newName: learntogrow-backend
    newTag: dev
  - name: ghcr.io/learnmv/learntogrow-frontend
    newName: learntogrow-frontend
    newTag: dev

commonLabels:
  app.kubernetes.io/name: learntogrow
  app.kubernetes.io/part-of: learntogrow-platform
