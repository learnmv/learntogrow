apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: backend
        image: ghcr.io/learnmv/learntogrow-backend
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: db-config
              key: host
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: db-config
              key: port
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: learntogrow-secrets
              key: db-name
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: learntogrow-secrets
              key: db-user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: learntogrow-secrets
              key: db-password
        - name: OLLAMA_URL
          valueFrom:
            secretKeyRef:
              name: learntogrow-secrets
              key: ollama-url
        - name: OLLAMA_API_KEY
          valueFrom:
            secretKeyRef:
              name: learntogrow-secrets
              key: ollama-api-key
              optional: true
        - name: OLLAMA_MODEL
          valueFrom:
            secretKeyRef:
              name: learntogrow-secrets
              key: ollama-model
        - name: OLLAMA_TIMEOUT
          valueFrom:
            secretKeyRef:
              name: learntogrow-secrets
              key: ollama-timeout
        - name: OLLAMA_ENABLE_STRUCTURED_OUTPUTS
          value: "false"
        - name: OLLAMA_GENERATION_WORKERS
          value: "3"
        - name: OLLAMA_QUALITY_MODE
          value: "reviewed"
        - name: OLLAMA_CANDIDATE_COUNT
          value: "1"
        - name: OLLAMA_MAX_REPAIR_ATTEMPTS
          value: "0"
        - name: OLLAMA_MIN_REVIEW_SCORE
          value: "0.75"
        - name: PARENT_ASSISTANT_MODEL
          value: "gemma4:31b"
        - name: PARENT_ASSISTANT_TIMEOUT
          value: "120"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
