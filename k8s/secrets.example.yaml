apiVersion: v1
kind: Secret
metadata:
  name: learntogrow-secrets
  namespace: default
type: Opaque
stringData:
  db-name: "your-database-name"
  db-user: "your-database-user"
  db-password: "your-database-password"
  ollama-url: "https://ollama.com"
  ollama-api-key: "your-ollama-cloud-api-key"
  ollama-model: "gemma4:31b"
  ollama-timeout: "300"
