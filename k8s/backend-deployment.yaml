apiVersion: apps/v1
kind: Deployment
metadata:
  name: learntogrow-backend
  namespace: default
  labels:
    app: learntogrow-backend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: learntogrow-backend
  template:
    metadata:
      labels:
        app: learntogrow-backend
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: backend
        image: ghcr.io/learnmv/learntogrow-backend:dev
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: DB_HOST
          value: "10.0.0.131"
        - name: DB_PORT
          value: "30432"
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: learntogrow-secrets
              key: db-name
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: learntogrow-secrets
              key: db-user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: learntogrow-secrets
              key: db-password
        - name: OLLAMA_URL
          value: "http://10.0.0.131:11434"
        - name: OLLAMA_MODEL
          value: "kimi-k2.5:cloud"
        - name: OLLAMA_TIMEOUT
          value: "60"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
