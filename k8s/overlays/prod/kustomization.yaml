apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: learntogrow-prod

resources:
  - ../../base
  - backend-service.yaml
  - frontend-service.yaml
  - frontend-config.yaml

# Note: Apply secrets manually with:
# kubectl apply -f secrets.yaml

configMapGenerator:
  - name: db-config
    literals:
      - host=10.0.0.134
      - port=30432

images:
  - name: ghcr.io/learnmv/learntogrow-backend
    newTag: stable
  - name: ghcr.io/learnmv/learntogrow-frontend
    newTag: stable
