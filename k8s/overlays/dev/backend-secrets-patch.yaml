apiVersion: apps/v1
kind: Deployment
metadata:
  name: learntogrow-backend
spec:
  template:
    spec:
      containers:
      - name: backend
        env:
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: dev-learntogrow-secrets
              key: db-name
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: dev-learntogrow-secrets
              key: db-user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: dev-learntogrow-secrets
              key: db-password
        - name: OLLAMA_URL
          valueFrom:
            secretKeyRef:
              name: dev-learntogrow-secrets
              key: ollama-url
        - name: OLLAMA_MODEL
          valueFrom:
            secretKeyRef:
              name: dev-learntogrow-secrets
              key: ollama-model
        - name: OLLAMA_TIMEOUT
          valueFrom:
            secretKeyRef:
              name: dev-learntogrow-secrets
              key: ollama-timeout
